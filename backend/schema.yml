  /api/tasks/submit/:
    post:
      operationId: tasks_submit_create
      tags:
      - tasks
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    DailyTask:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: string
        is_blocker:
          type: boolean
        project_details:
          allOf:
          - $ref: '#/components/schemas/Project'
          readOnly: true
        date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_at_formatted:
          type: string
          readOnly: true
        submission:
          type: integer
          nullable: true
      required:
      - content
      - created_at
      - created_at_formatted
      - id
      - project_details
    DailyTaskRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        is_blocker:
          type: boolean
        project_id:
          type: integer
          writeOnly: true
        date:
          type: string
          format: date
        submission:
          type: integer
          nullable: true
      required:
      - content
      - project_id
    Employee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        designation:
          type: string
          maxLength: 100
        department:
          type: integer
          nullable: true
        department_name:
          type: string
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        avatar:
          type: string
          format: uri
          nullable: true
        is_manager:
          type: boolean
          description: Check this box if the employee is a manager.
      required:
      - department_name
      - designation
      - email
      - first_name
      - full_name
      - id
      - last_name
      - username
    EmployeeDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
          readOnly: true
        avatar:
          type: string
          format: uri
          nullable: true
        employee_id:
          type: string
          nullable: true
          maxLength: 50
        pan_number:
          type: string
          nullable: true
          maxLength: 20
        personal_email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        emergency_contact:
          type: string
          nullable: true
          maxLength: 20
        employment_type:
          $ref: '#/components/schemas/EmploymentTypeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        designation:
          type: string
          maxLength: 100
        department:
          type: integer
          nullable: true
        department_name:
          type: string
          readOnly: true
        reports_to_name:
          type: string
          readOnly: true
        date_joined:
          type: string
          readOnly: true
        reporting_manager:
          type: integer
          nullable: true
      required:
      - date_joined
      - department_name
      - designation
      - email
      - first_name
      - id
      - last_name
      - reports_to_name
      - username
    EmployeeDetailRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        avatar:
          type: string
          format: binary
          nullable: true
        employee_id:
          type: string
          nullable: true
          maxLength: 50
        pan_number:
          type: string
          nullable: true
          maxLength: 20
        personal_email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        emergency_contact:
          type: string
          nullable: true
          maxLength: 20
        employment_type:
          $ref: '#/components/schemas/EmploymentTypeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        designation:
          type: string
          minLength: 1
          maxLength: 100
        department:
          type: integer
          nullable: true
        reporting_manager:
          type: integer
          nullable: true
      required:
      - designation
      - email
      - first_name
      - last_name
    EmployeeProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        designation:
          type: string
          maxLength: 100
        department:
          type: integer
          nullable: true
        department_name:
          type: string
          readOnly: true
        avatar:
          type: string
          format: uri
          nullable: true
        is_manager:
          type: boolean
          description: Check this box if the employee is a manager.
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - department_name
      - designation
      - email
      - first_name
      - id
      - last_name
      - username
    EmployeeProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        designation:
          type: string
          minLength: 1
          maxLength: 100
        department:
          type: integer
          nullable: true
        avatar:
          type: string
          format: binary
          nullable: true
        is_manager:
          type: boolean
          description: Check this box if the employee is a manager.
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - designation
      - email
      - first_name
      - last_name
    EmploymentTypeEnum:
      enum:
      - Full-Time
      - Part-Time
      - Contract
      - Internship
      type: string
      description: |-
        * `Full-Time` - Full-Time
        * `Part-Time` - Part-Time
        * `Contract` - Contract
        * `Internship` - Internship
    ManagerDropdown:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
      required:
      - full_name
      - id
      - username
    PatchedDailyTaskRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        is_blocker:
          type: boolean
        project_id:
          type: integer
          writeOnly: true
        date:
          type: string
          format: date
        submission:
          type: integer
          nullable: true
    PatchedEmployeeDetailRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        avatar:
          type: string
          format: binary
          nullable: true
        employee_id:
          type: string
          nullable: true
          maxLength: 50
        pan_number:
          type: string
          nullable: true
          maxLength: 20
        personal_email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        emergency_contact:
          type: string
          nullable: true
          maxLength: 20
        employment_type:
          $ref: '#/components/schemas/EmploymentTypeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        designation:
          type: string
          minLength: 1
          maxLength: 100
        department:
          type: integer
          nullable: true
        reporting_manager:
          type: integer
          nullable: true
    PatchedEmployeeProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        designation:
          type: string
          minLength: 1
          maxLength: 100
        department:
          type: integer
          nullable: true
        avatar:
          type: string
          format: binary
          nullable: true
        is_manager:
          type: boolean
          description: Check this box if the employee is a manager.
        role:
          $ref: '#/components/schemas/RoleEnum'
    PatchedProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        client_name:
          type: string
          nullable: true
          maxLength: 100
        acronym:
          type: string
          nullable: true
          maxLength: 15
        description:
          type: string
          nullable: true
        color_code:
          type: string
          minLength: 1
          maxLength: 20
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          minLength: 1
          maxLength: 20
        assigned_employees:
          type: array
          items:
            type: integer
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        client_name:
          type: string
          nullable: true
          maxLength: 100
        acronym:
          type: string
          nullable: true
          maxLength: 15
        description:
          type: string
          nullable: true
        color_code:
          type: string
          maxLength: 20
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          maxLength: 20
        team_size:
          type: string
          readOnly: true
        team_structure:
          type: string
          readOnly: true
        assigned_employees_grouped:
          type: string
          readOnly: true
        assigned_employees:
          type: array
          items:
            type: integer
      required:
      - assigned_employees
      - assigned_employees_grouped
      - id
      - name
      - team_size
      - team_structure
    ProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        client_name:
          type: string
          nullable: true
          maxLength: 100
        acronym:
          type: string
          nullable: true
          maxLength: 15
        description:
          type: string
          nullable: true
        color_code:
          type: string
          minLength: 1
          maxLength: 20
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          minLength: 1
          maxLength: 20
        assigned_employees:
          type: array
          items:
            type: integer
      required:
      - assigned_employees
      - name
    RoleEnum:
      enum:
      - Employee
      - Manager
      type: string
      description: |-
        * `Employee` - Employee
        * `Manager` - Manager
    StatusEnum:
      enum:
      - Active
      - Inactive
      type: string
      description: |-
        * `Active` - Active
        * `Inactive` - Inactive
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
