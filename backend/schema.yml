  /api/manager/employees/{id}/:
    get:
      operationId: manager_employees_retrieve
      description: |-
        Handles fetching detail data for the Modal (GET),
        deleting an employee (DELETE), and can be used for editing (PUT/PATCH).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - manager
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
          description: ''
    put:
      operationId: manager_employees_update
      description: |-
        Handles fetching detail data for the Modal (GET),
        deleting an employee (DELETE), and can be used for editing (PUT/PATCH).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - manager
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeDetailRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
          description: ''
    patch:
      operationId: manager_employees_partial_update
      description: |-
        Handles fetching detail data for the Modal (GET),
        deleting an employee (DELETE), and can be used for editing (PUT/PATCH).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - manager
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeDetailRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
          description: ''
    delete:
      operationId: manager_employees_destroy
      description: |-
        Handles fetching detail data for the Modal (GET),
        deleting an employee (DELETE), and can be used for editing (PUT/PATCH).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - manager
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/manager/managers-list/:
