        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: projects_destroy
      description: Handles GET (read one), PUT/PATCH (update), and DELETE for a single
        Project
      parameters:
      - in: path
