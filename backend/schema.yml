      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
          description: ''
  /api/projects/:
    get:
      operationId: projects_list
      description: Handles GET (list all) and POST (create new) for Projects
      tags:
