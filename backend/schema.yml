openapi: 3.0.3
info:
  title: HR & Project Management API
  version: 1.0.0
  description: |-
    Official API documentation for the HR, Employee, and Project management system.

    ### Handover Notes
    * **Completed Modules:** Employee Management, Project Creation, Team Structure, Authentication.
    * **Pending Modules (To be implemented):** Salary calculations, Bulk Salary generation.

    All endpoints currently require Token Authentication via the `Authorization: Token <your_token>` header.
  contact:
    name: Rupesh Bhatta
    email: rupesh.bhatta1234@gmail.com
paths:
  /api/change-password/:
    post:
      operationId: change_password_create
      tags:
      - change-password
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
