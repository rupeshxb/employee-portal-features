name: Keep Render Server Alive

on:
  schedule:
    # Runs every 14 minutes — safely under Render's 15-minute inactivity threshold
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --silent --show-error --fail --max-time 30 \
            https://employee-portal-r59t.onrender.com/api/health/
          echo "Ping successful at $(date -u)"
